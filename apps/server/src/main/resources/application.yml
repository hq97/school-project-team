server:
  port: 8080

spring:
  application:
    name: school-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/school_affairs}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产默认关闭自动清理，避免误删历史迁移记录
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml

# 应用自定义配置（对应 .env.example 键名，改由 application.yml 承载）
school:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me}
    access-token-ttl: 900          # 秒，15 分钟
    refresh-token-ttl: 604800      # 秒，7 天
  ai:
    enabled: false
    provider: local
    scenarios:
      summary: { enabled: false }
      draft: { enabled: false }
      attribution: { enabled: false }
      assist: { enabled: false }
      tuning: { enabled: false }
